<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BloodLink - Search Donor</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="navbar">

        <div class="logo">
            🩸 BloodLink
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="register-donor.html">
                Register Donor
            </a>

            <a href="search-donor.html">
                Search Donor
            </a>

            <a href="donations.html">
                Donations
            </a>

        </div>

    </nav>


    <!-- =====================================================
         SEARCH SECTION
    ====================================================== -->

    <section class="search-section">

        <div class="search-container">

            <h1>
                Find a Blood Donor
            </h1>

            <p>
                Search for available blood donors
                by blood group and city.
            </p>


            <!-- SEARCH FORM -->

            <form id="searchForm">


                <!-- BLOOD GROUP -->

                <label for="searchBloodGroup">
                    Blood Group
                </label>

                <select
                    id="searchBloodGroup"
                    required>

                    <option value="">
                        Select Blood Group
                    </option>

                </select>


                <!-- CITY -->

                <label for="searchCity">
                    City
                </label>

                <input
                    type="text"
                    id="searchCity"
                    placeholder="Enter city"
                    required
                >


                <!-- SEARCH BUTTON -->

                <button
                    type="submit"
                    class="submit-btn">

                    🔍 Search Donors

                </button>

            </form>


            <!-- SEARCH MESSAGE -->

            <div
                id="searchMessage"
                class="message">

            </div>

        </div>

    </section>


    <!-- =====================================================
         DONOR RESULTS
    ====================================================== -->

    <section class="results-section">

        <h2>
            Available Donors
        </h2>


        <div
            id="donorResults"
            class="donor-results">

        </div>

    </section>


    <!-- =====================================================
         BLOOD REQUEST POPUP
    ====================================================== -->

    <div
        id="requestPopup"
        class="request-popup">


        <div class="request-box">


            <!-- CLOSE BUTTON -->

            <button
                type="button"
                class="request-close"
                onclick="closeRequestPopup()">

                ×

            </button>


            <!-- POPUP ICON -->

            <div class="request-icon">
                🩸
            </div>


            <!-- POPUP TITLE -->

            <h2>
                Request Blood
            </h2>


            <p>
                Please provide the required details
                to submit a blood request.
            </p>


            <!-- REQUEST FORM -->

            <form id="requestForm">


                <!-- PATIENT NAME -->

                <label for="patientName">
                    Patient Name
                </label>

                <input
                    type="text"
                    id="patientName"
                    placeholder="Enter patient name"
                    required
                >


                <!-- HOSPITAL -->

                <label for="hospitalName">
                    Hospital Name
                </label>

                <input
                    type="text"
                    id="hospitalName"
                    placeholder="Enter hospital name"
                    required
                >


                <!-- CONTACT -->

                <label for="requestContact">
                    Contact Number
                </label>

                <input
                    type="tel"
                    id="requestContact"
                    placeholder="Enter contact number"
                    required
                >


                <!-- URGENCY -->

                <label for="urgency">
                    Urgency
                </label>

                <select
                    id="urgency"
                    required>

                    <option value="">
                        Select Urgency
                    </option>

                    <option value="Normal">
                        Normal
                    </option>

                    <option value="Urgent">
                        Urgent
                    </option>

                    <option value="Emergency">
                        Emergency
                    </option>

                </select>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="request-submit">

                    🩸 Submit Blood Request

                </button>

            </form>


            <!-- REQUEST MESSAGE -->

            <div
                id="requestMessage"
                class="request-message">

            </div>

        </div>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer>

        <p>
            © 2026 BloodLink - Blood Donor Registry and Search
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/script.js"></script>

</body>

</html>
